<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101720" />
  <title>Eziologia ictus</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Eziologia" />

  <style>
    html, body { margin:0; padding:0; background:#EDF1F4; }
    /* Override per il notch: specificita' maggiore degli stili del componente */
    body .etio header { padding-top:calc(16px + env(safe-area-inset-top)); }
    body .etio { padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
